# Note: This isn't actually used by the tests as we test different apps in different suites

# envoy-gateway is a child of gateway-api-bundle, which is not a default app of any Release,
# so this suite actually exercises the bundle install path instead of falling back to the
# cluster chart the way the defaultbundleapp suite does.
appName: "envoy-gateway"
repoName: "envoy-gateway-app"
appCatalog: "giantswarm"

# CAPI providers to test against when triggering `/run app-test-suites` from a PR
providers:
- capa
